<div class="video-wrapper">
  <!-- Pelindung Atas (Mencegah Klik Pop-out/Buka di Google Drive) -->
  <div class="drive-shield"></div>

  <!-- Player Video Google Drive -->
  <iframe 
    src="https://drive.google.com/file/d/KODE_FILE_VIDEO_ANDA/preview" 
    allow="autoplay" 
    allowfullscreen>
  </iframe>
</div>

<style>
  .video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }

  .video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* Menutupi tombol "Pop-out" / "Buka di Google Drive" di pojok kanan atas */
  .drive-shield {
    position: absolute;
    top: 0;
    right: 0;
    width: 60px;
    height: 60px;
    z-index: 10;
    background: transparent;
  }
</style>
