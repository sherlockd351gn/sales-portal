<div class="video-wrapper">
  <!-- Pelindung Atas (Menutupi Judul & Tombol Share) -->
  <div class="shield-top"></div>
  
  <!-- Pelindung Bawah Kiri (Menutupi Tombol Watch on YouTube) -->
  <div class="shield-bottom-left"></div>

  <!-- Frame Video YouTube -->
  <iframe 
    src="https://www.youtube.com/embed/KODE_VIDEO_ANDA?rel=0&modestbranding=1&controls=1" 
    allow="autoplay; encrypted-media" 
    allowfullscreen>
  </iframe>
</div>

<style>
  .video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    margin-bottom: 12px;
  }

  .video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* 1. Menutupi bagian ATAS (Judul & Tombol Share) */
  .shield-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 75px; /* Dipertinggi dari 60px ke 75px */
    z-index: 10;
    background: transparent;
  }

  /* 2. Menutupi bagian BAWAH KIRI (Tombol Watch on YouTube) */
  .shield-bottom-left {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 60%;  /* Menutupi setengah area bawah tempat tombol Watch on YouTube berada */
    height: 50px; /* Menutupi tinggi bar tombol YouTube */
    z-index: 10;
    background: transparent;
  }
</style>
